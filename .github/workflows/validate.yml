name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  datasets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate datasets and generated tables
        run: python analysis/build_tables.py --check
